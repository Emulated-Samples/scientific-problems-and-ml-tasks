version = "1.0"

[metadata]
source = "emulated"
environment = "sc-pcabench"
branch = "release-from_scratch_pca"
problem_id = "from_scratch_pca"
difficulty = "hard"
tags = [ "emulated" ]
# Measured floor (2026-07-20): oracle replay of the
# shipped solution on the staged pin scored 0.9998743230945997.
# Floor = measured x 0.9, rounded down to 2dp.
min_replay_score = 0.89

[agent]
timeout_sec = 86400
user = "agent"
# Agent-phase egress is model-API-only; this task's agent phase needs no other host.
network_mode = "allowlist"
allowed_hosts = [ "api.anthropic.com", "statsig.anthropic.com", "sentry.io", "api.openai.com", "openrouter.ai" ]

[verifier]
timeout_sec = 10800
user = "root"
network_mode = "no-network"

[verifier.env]
[solution.env]
[environment]
build_timeout_sec = 2700
cpus = 8
memory_mb = 65536
storage_mb = 20480
gpus = 0
network_mode = "public"
workdir = "/hyperfocal/env/workspace"
mcp_servers = []

